<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title description">
  <title id="title">Golden dataset for retrieval-augmented generation</title>
  <desc id="description">A flow diagram showing a broad source data collection being curated into a trusted golden dataset, with benchmark questions and expert testing using that dataset for retrieval.</desc>
  <style>
    .title { font: 700 30px Segoe UI, Arial, sans-serif; fill: #172b4d; }
    .label { font: 700 20px Segoe UI, Arial, sans-serif; fill: #172b4d; }
    .body { font: 16px Segoe UI, Arial, sans-serif; fill: #31445e; }
    .small { font: 14px Segoe UI, Arial, sans-serif; fill: #31445e; }
    .tag { font: 700 13px Segoe UI, Arial, sans-serif; letter-spacing: 0; fill: #ffffff; }
  </style>
  <rect width="1200" height="650" fill="#f7f9fc"/>
  <text class="title" x="70" y="70">Golden Dataset for RAG</text>
  <text class="body" x="70" y="100">A trusted retrieval corpus and a known-answer evaluation baseline.</text>

  <rect x="70" y="165" width="280" height="335" rx="8" fill="#ffffff" stroke="#8fa3bf" stroke-width="2"/>
  <rect x="70" y="165" width="280" height="42" rx="8" fill="#536b86"/>
  <text class="tag" x="92" y="192">1. FULL DATA SOURCE</text>
  <text class="label" x="92" y="245">All available content</text>
  <text class="body" x="92" y="280">Policies, files, records,</text>
  <text class="body" x="92" y="305">wikis, and knowledge bases</text>
  <rect x="92" y="350" width="236" height="112" rx="5" fill="#edf2f7"/>
  <text class="small" x="112" y="382">May include duplicates, stale</text>
  <text class="small" x="112" y="407">content, gaps, and errors.</text>
  <text class="small" x="112" y="432">Do not retrieve from blindly.</text>

  <path d="M370 335 H470" fill="none" stroke="#0078d4" stroke-width="4"/>
  <path d="M470 335 L452 324 M470 335 L452 346" fill="none" stroke="#0078d4" stroke-width="4" stroke-linecap="round"/>
  <rect x="370" y="260" width="108" height="50" rx="25" fill="#dff1ff" stroke="#0078d4" stroke-width="1.5"/>
  <text class="small" x="385" y="291">Curate</text>
  <text class="small" x="390" y="375">Validate</text>
  <text class="small" x="382" y="398">Remove noise</text>
  <text class="small" x="382" y="421">Keep scope</text>

  <rect x="495" y="145" width="355" height="375" rx="8" fill="#ffffff" stroke="#0078d4" stroke-width="3"/>
  <rect x="495" y="145" width="355" height="47" rx="8" fill="#0078d4"/>
  <text class="tag" x="520" y="175">2. GOLDEN DATASET</text>
  <text class="label" x="520" y="238">Trusted retrieval corpus</text>
  <text class="body" x="520" y="272">Curated documents and files</text>
  <text class="body" x="520" y="297">used to ground RAG answers.</text>
  <rect x="520" y="330" width="305" height="145" rx="5" fill="#e6f4ff"/>
  <text class="small" x="544" y="362">Clean, accurate, and representative</text>
  <text class="small" x="544" y="390">Approved context for retrieval</text>
  <text class="small" x="544" y="418">Versioned and reviewable</text>
  <text class="small" x="544" y="446">Shared baseline for all testing</text>

  <path d="M870 250 H955" fill="none" stroke="#0078d4" stroke-width="4"/>
  <path d="M955 250 L937 239 M955 250 L937 261" fill="none" stroke="#0078d4" stroke-width="4" stroke-linecap="round"/>
  <path d="M870 420 H955" fill="none" stroke="#2f855a" stroke-width="4" stroke-dasharray="9 7"/>
  <path d="M955 420 L937 409 M955 420 L937 431" fill="none" stroke="#2f855a" stroke-width="4" stroke-linecap="round"/>

  <rect x="975" y="135" width="180" height="245" rx="8" fill="#ffffff" stroke="#805ad5" stroke-width="2"/>
  <rect x="975" y="135" width="180" height="40" rx="8" fill="#805ad5"/>
  <text class="tag" x="992" y="161">3. EVALUATE</text>
  <text class="label" x="992" y="210">Benchmark Q&amp;A</text>
  <text class="small" x="992" y="243">Known questions</text>
  <text class="small" x="992" y="266">Known correct</text>
  <text class="small" x="992" y="289">answers</text>
  <text class="small" x="992" y="312">Measure retrieval</text>
  <text class="small" x="992" y="335">and answer quality</text>
  <text class="small" x="992" y="358">over time</text>

  <rect x="975" y="405" width="180" height="185" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="2"/>
  <rect x="975" y="405" width="180" height="40" rx="8" fill="#2f855a"/>
  <text class="tag" x="992" y="431">4. EXPLORE</text>
  <text class="label" x="992" y="480">Expert questions</text>
  <text class="small" x="992" y="513">Additional testing</text>
  <text class="small" x="992" y="536">is welcome. It retrieves</text>
  <text class="small" x="992" y="559">from the same corpus.</text>

  <text class="small" x="70" y="600">The golden dataset is an intentionally selected, quality-controlled subset of the broader source.</text>
  <text class="small" x="70" y="624">Known-answer benchmarks add measurable evaluation evidence.</text>
</svg>